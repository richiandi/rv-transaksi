<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuitDuo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8E7;--ink:#1A2340;--card:#FFFDF6;--mute:#7b7a8c;--line:#efe3c4;--red:#FF5A36;--lime:#C7F25B;--peach:#FFC2A8;--lav:#DCD3FF;--mint:#BDEBD9;
--sh:0 10px 24px -10px rgba(26,35,64,.22),inset 0 -4px 0 rgba(26,35,64,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121830;--ink:#FFF8E7;--card:#1D2648;--mute:#a4a8c4;--line:#2b3562}}
:root[data-theme="dark"]{--bg:#121830;--ink:#FFF8E7;--card:#1D2648;--mute:#a4a8c4;--line:#2b3562}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;justify-content:center}
h1,h2,.big{font-family:'Baloo 2','Plus Jakarta Sans',sans-serif}
#app{width:100%;max-width:440px;height:100%;overflow-y:auto;padding:14px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font:800 24px 'Baloo 2';letter-spacing:-.5px}
.mark{width:42px;height:42px;border-radius:14px;background:#1A2340;display:grid;place-items:center;box-shadow:var(--sh)}
.mark i{width:22px;height:22px;border-radius:50%;background:var(--lime);box-shadow:-7px 0 0 -2px var(--red);display:block}
.av{display:flex}.av b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 15px 'Baloo 2';color:#1A2340;border:3px solid var(--bg)}
.av b:first-child{background:var(--peach)}.av b:last-child{background:var(--lime);margin-left:-10px}
.row{display:flex;align-items:center;gap:8px}
.pill{background:var(--card);border-radius:999px;padding:9px 14px;box-shadow:var(--sh);font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.month{margin:14px 0 10px;justify-content:space-between}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}.sync:before{content:"";width:9px;height:9px;border-radius:50%;background:#2fb67c}
.hero{background:radial-gradient(circle at 85% 20%,#4a2a3f 0,#1A2340 55%);color:#FFF8E7;border-radius:32px;padding:22px;position:relative;overflow:hidden;box-shadow:0 18px 30px -14px rgba(26,35,64,.6)}
.tag{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;display:inline-block}
.hero .lbl{margin-top:22px;opacity:.75}
.hero .big{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin:4px 0 6px}
.hero p{opacity:.6;font-size:13px;max-width:55%}
.sticker{position:absolute;right:14px;top:62px;background:#FFF8E7;color:var(--red);border-radius:14px;padding:8px 12px;font-weight:800;font-size:12px;transform:rotate(4deg);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.coin{position:absolute;right:18px;bottom:74px;width:104px;height:70px;border-radius:16px;background:linear-gradient(135deg,var(--lime),#9bd23a);transform:rotate(-8deg);box-shadow:0 8px 0 rgba(0,0,0,.18)}
.coin:after{content:"";position:absolute;left:16px;bottom:14px;width:26px;height:26px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #FFF8E7}
.stats{display:flex;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15)}
.stats small{opacity:.6;display:block}.stats b{font:800 18px 'Baloo 2'}
.stack{position:relative;height:196px;margin:26px 0 8px}
.goal{position:absolute;inset:0;border-radius:30px;padding:18px 20px;box-shadow:var(--sh);color:#1A2340;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s;text-align:left;width:100%;overflow:hidden}
.goal .t{background:rgba(26,35,64,.12);border-radius:12px;padding:5px 10px;font-size:11px;font-weight:800;display:inline-block}
.goal h2{font-size:26px;margin-top:12px;line-height:1.1}.goal .amt{opacity:.7;font-weight:700}
.goal .em{position:absolute;right:16px;top:44px;font-size:48px;transform:rotate(8deg)}
.bar{height:14px;background:rgba(26,35,64,.14);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:#1A2340;min-width:14px;transition:width .6s}
.goal .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.dots{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--mute);font-size:12px}
.dots span{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{width:34px;border-radius:99px;background:var(--ink)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--sh)}
.box small{color:var(--mute);display:block}.box .big{font-size:24px;font-weight:800;letter-spacing:-.5px}
.box.w{grid-column:span 2}.c1{background:var(--lav);color:#1A2340}.c2{background:var(--peach);color:#1A2340}.c3{background:var(--mint);color:#1A2340}
.c1 small,.c2 small,.c3 small{color:#1A2340;opacity:.65}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.split i{display:block;transition:width .5s}
h3{font:700 18px 'Baloo 2';margin:22px 4px 10px}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:none}
.tx div:nth-child(2){flex:1;min-width:0}.tx small{color:var(--mute)}.tx b.n{white-space:nowrap}
.pos{color:#1c9c64}.neg{color:var(--red)}
.cat{margin-bottom:12px}.cat .h{display:flex;justify-content:space-between;font-weight:700}
.cat .bar{background:var(--line);margin:8px 0 2px}.cat .bar i{background:var(--lime)}.cat .bar i.over{background:var(--red)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:412px;background:var(--card);border-radius:30px;display:flex;align-items:flex-end;justify-content:space-around;padding:8px 6px;box-shadow:0 14px 30px -8px rgba(26,35,64,.35);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:20px;font-size:12px;font-weight:700;color:var(--mute)}
nav button span{font-size:22px;line-height:1}nav button.on{background:var(--bg);color:var(--ink)}
nav .fab{flex:none;width:78px;margin-top:-34px;color:var(--ink)}
.fab i{width:66px;height:66px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:500 38px/1 'Baloo 2';border:5px solid var(--card);box-shadow:0 10px 0 -2px rgba(255,90,54,.35);transition:transform .2s}
.fab:active i{transform:scale(.92) rotate(90deg)}
.sheet{position:fixed;inset:0;background:rgba(26,35,64,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.sheet form,.sheet .in{background:var(--bg);width:100%;max-width:440px;border-radius:32px 32px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.seg label{position:relative}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px;border-radius:16px;background:var(--card);font-weight:700;box-shadow:var(--sh)}
.seg input:checked+span{background:var(--ink);color:var(--bg)}.seg input:focus-visible+span{outline:3px solid var(--red)}
.f{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:13px 14px;font:inherit;margin-bottom:10px}
.f.amt{font:800 28px 'Baloo 2'}
.btn{width:100%;background:var(--red);color:#fff;border-radius:20px;padding:14px;font-weight:800;font-size:16px;box-shadow:0 6px 0 #c9401f}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--sh);margin-top:10px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;transition:transform .35s}.toast.s{transform:translate(-50%,0)}
.note{color:var(--mute);font-size:13px;margin:6px 4px 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><form id="form">
 <h1 style="font-size:26px">Catat transaksi</h1>
 <div class="seg" role="radiogroup" aria-label="Jenis">
  <label><input type="radio" name="type" value="out" checked><span>Keluar</span></label>
  <label><input type="radio" name="type" value="in"><span>Masuk</span></label>
  <label><input type="radio" name="type" value="save"><span>Tabung</span></label></div>
 <input class="f amt" name="amt" inputmode="numeric" placeholder="Rp0" aria-label="Jumlah" required>
 <select class="f" name="cat" aria-label="Kategori"></select>
 <input class="f" name="note" placeholder="Catatan (opsional)" aria-label="Catatan">
 <div class="seg" style="grid-template-columns:1fr 1fr"><label><input type="radio" name="who" value="A" checked><span>A</span></label><label><input type="radio" name="who" value="V"><span>V</span></label></div>
 <button class="btn" type="submit">Simpan</button>
 <button class="btn alt" type="button" id="cancel">Batal</button>
</form></div>
<div class="toast" id="toast" role="status"></div>
<script>
var CATS={Makan:['🍜','#FFC2A8'],Transport:['🛵','#BDEBD9'],Belanja:['🛍️','#DCD3FF'],Tagihan:['💡','#FFE9A3'],Hiburan:['🎮','#C7F25B'],Gaji:['💼','#BDEBD9'],Tabungan:['🐷','#FFC2A8']};
var LIM={Makan:3000000,Transport:1000000,Belanja:2000000,Tagihan:2500000,Hiburan:800000};
var GOALS=[{n:'Liburan ke Bali',t:15000000,s:6500000,d:'TARGET 20 DES 2026',e:'🌴',c:'#C7F25B'},{n:'Dana darurat',t:30000000,s:11000000,d:'TARGET 30 JUN 2027',e:'🛟',c:'#FFC2A8'},{n:'Nikahan kita',t:80000000,s:19000000,d:'TARGET 14 NOV 2028',e:'💍',c:'#DCD3FF'}];
var now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
var D={tx:[
 {id:1,type:'in',amt:12000000,cat:'Gaji',note:'Gaji A',who:'A',date:ym+'-01'},
 {id:2,type:'in',amt:9500000,cat:'Gaji',note:'Gaji V',who:'V',date:ym+'-02'},
 {id:3,type:'out',amt:2400000,cat:'Tagihan',note:'Listrik & internet',who:'A',date:ym+'-03'},
 {id:4,type:'out',amt:186000,cat:'Makan',note:'Makan malam berdua',who:'V',date:ym+'-08'},
 {id:5,type:'out',amt:420000,cat:'Belanja',note:'Belanja bulanan',who:'V',date:ym+'-10'},
 {id:6,type:'save',amt:2500000,cat:'Tabungan',note:'Tabungan Bali',who:'A',date:ym+'-12'},
 {id:7,type:'out',amt:64000,cat:'Transport',note:'Ojek online',who:'A',date:ym+'-14'}],nid:8,top:0};
try{var sv=localStorage.getItem('duitduo');if(sv)D=JSON.parse(sv)}catch(e){}
var tab='ring',cur=ym;
function save(){try{localStorage.setItem('duitduo',JSON.stringify(D))}catch(e){}}
function rp(n){return 'Rp'+Math.round(n).toLocaleString('id-ID')}
function jt(n){return n>=1e9?'Rp'+(n/1e9).toFixed(1).replace('.',',')+' M':n>=1e6?'Rp'+(n/1e6).toFixed(1).replace('.',',').replace(',0','')+' jt':rp(n)}
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function mlabel(){var p=cur.split('-');return BLN[+p[1]-1]+' '+p[0]}
function shift(d){var p=cur.split('-'),x=new Date(+p[0],+p[1]-1+d,1);cur=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');draw()}
function mt(){return D.tx.filter(function(t){return t.date.slice(0,7)===cur})}
function sum(l,ty,who){return l.filter(function(t){return t.type===ty&&(!who||t.who===who)}).reduce(function(a,t){return a+t.amt},0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function head(){return '<div class="top"><div class="logo"><div class="mark"><i></i></div>DuitDuo</div><div class="av" aria-label="Kita berdua"><b>A</b><b>V</b></div></div>'+
 '<div class="row month"><div class="pill"><button aria-label="Bulan sebelumnya" onclick="shift(-1)">‹</button><span style="min-width:120px;text-align:center">'+mlabel()+'</span><button aria-label="Bulan berikutnya" onclick="shift(1)">›</button></div><span class="sync">Tersinkron</span></div>'}
function hero(l){var o=sum(l,'out'),i=sum(l,'in'),s=sum(l,'save');
 return '<section class="hero"><span class="tag">✦ Pengeluaran</span><div class="lbl">Total pengeluaran bulan ini</div><div class="big">'+rp(o)+'</div><p>'+(Object.keys(LIM).length?'Bujet bulan ini '+jt(9300000):'')+'</p><div class="sticker">cek lagi yuk</div><div class="coin"></div>'+
 '<div class="stats"><div><small>Pemasukan</small><b>'+jt(i)+'</b></div><div><small>Ditabung</small><b>'+jt(s)+'</b></div><div><small>Terpakai</small><b>'+jt(o)+'</b></div></div></section>'}
function stack(){var n=GOALS.length,h='<div class="stack" id="stk">';
 for(var k=0;k<n;k++){var g=GOALS[(D.top+k)%n],p=Math.round(g.s/g.t*100);
  h+='<button class="goal" '+(k?'tabindex="-1" aria-hidden="true"':'aria-label="Target berikutnya"')+' style="background:'+g.c+';transform:translateY('+(-k*16)+'px) scale('+(1-k*.05)+') rotate('+(k?(k%2?-1.5:1.5):0)+'deg);z-index:'+(9-k)+';opacity:'+(k>2?0:1)+'" onclick="nextGoal()">'+
  '<span class="t">'+g.d+'</span><span class="em">'+g.e+'</span><h2>'+g.n+'</h2><div class="amt">'+jt(g.s)+' dari '+jt(g.t)+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="meta"><span>jalan '+p+'%</span><span>sisa '+jt(g.t-g.s)+'</span></div></button>'}
 var d='';for(k=0;k<n;k++)d+='<i class="'+(k===0?'on':'')+'"></i>';
 return '<h3 style="margin-top:20px">Rencana kita</h3>'+h+'</div><div class="dots"><span>'+d+'</span><span>geser atau ketuk</span></div>'}
function nextGoal(){D.top=(D.top+1)%GOALS.length;save();draw()}
function bento(l){var i=sum(l,'in'),o=sum(l,'out'),s=sum(l,'save'),sisa=i-o-s,a=sum(l,'out','A'),v=sum(l,'out','V'),tot=a+v||1;
 return '<div class="bento"><div class="box c1"><small>Pemasukan</small><div class="big">'+jt(i)+'</div></div><div class="box c3"><small>Sisa bulan ini</small><div class="big">'+jt(sisa)+'</div></div>'+
 '<div class="box w"><small>Siapa yang jajan lebih banyak?</small><div class="split"><i style="width:'+a/tot*100+'%;background:var(--peach)"></i><i style="width:'+v/tot*100+'%;background:var(--lime)"></i></div><div class="row" style="justify-content:space-between"><b>A '+jt(a)+'</b><b>V '+jt(v)+'</b></div></div>'+
 '<div class="box c2 w"><small>Tabungan bulan ini</small><div class="big">'+jt(s)+' 🐷</div><small style="margin-top:2px">'+(s>=2000000?'Mantap, kalian rajin menabung!':'Yuk tabung sedikit lagi.')+'</small></div></div>'+
 '<h3>Terbaru</h3>'+txs(l.slice().sort(function(a,b){return b.date<a.date?-1:1}).slice(0,3))}
function txs(a){if(!a.length)return '<p class="note">Belum ada catatan. Ketuk tombol + untuk mulai.</p>';
 return a.map(function(t){var c=CATS[t.cat]||['💸','#eee'];return '<div class="tx"><div class="ic" style="background:'+c[1]+'">'+c[0]+'</div><div><b>'+esc(t.note||t.cat)+'</b><br><small>'+t.cat+' · '+t.who+' · '+t.date.slice(8)+'/'+t.date.slice(5,7)+'</small></div><b class="n '+(t.type==='in'?'pos':t.type==='out'?'neg':'')+'">'+(t.type==='in'?'+':t.type==='out'?'−':'')+rp(t.amt)+'</b></div>'}).join('')}
function budget(l){return '<h1 style="font-size:28px;margin:18px 4px 4px">Anggaran</h1><p class="note">Batas bulanan per kategori.</p>'+Object.keys(LIM).map(function(k){var u=l.filter(function(t){return t.type==='out'&&t.cat===k}).reduce(function(a,t){return a+t.amt},0),p=Math.min(100,u/LIM[k]*100);
 return '<div class="box cat"><div class="h"><span>'+CATS[k][0]+' '+k+'</span><span class="'+(u>LIM[k]?'neg':'')+'">'+jt(u)+' / '+jt(LIM[k])+'</span></div><div class="bar"><i class="'+(u>LIM[k]?'over':'')+'" style="width:'+p+'%"></i></div><small style="color:var(--mute)">'+(u>LIM[k]?'Lewat '+jt(u-LIM[k]):'Sisa '+jt(LIM[k]-u))+'</small></div>'}).join('')}
function more(){return '<h1 style="font-size:28px;margin:18px 4px 4px">Lainnya</h1><p class="note">Hubungkan ke Google Sheets untuk cadangan data kalian berdua.</p>'+
 '<div class="box"><b>Google Sheets</b><p class="note">Halaman ini tidak bisa terhubung langsung ke Google. Salin datanya, lalu tempel di sel A1 spreadsheet kalian.</p><button class="btn" onclick="csv()">Salin data (CSV)</button><button class="btn alt" onclick="themeT()">Ganti tema terang/gelap</button><button class="btn alt" onclick="reset()">Hapus semua data</button></div>'}
function csv(){var r=['Tanggal\tJenis\tKategori\tCatatan\tOleh\tJumlah'].concat(D.tx.map(function(t){return [t.date,t.type,t.cat,t.note,t.who,t.amt].join('\t')})).join('\n');
 try{navigator.clipboard.writeText(r).then(function(){toast('Data tersalin. Tempel di Google Sheets.')},function(){toast('Gagal menyalin. Izinkan akses papan klip.')})}catch(e){toast('Gagal menyalin. Izinkan akses papan klip.')}}
function themeT(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')}
function reset(){if(confirm('Hapus semua catatan?')){D.tx=[];save();draw();toast('Data dihapus')}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast s';setTimeout(function(){t.className='toast'},2200)}
function draw(){var l=mt(),h=head(),b='';
 if(tab==='ring')b=hero(l)+stack()+bento(l);
 else if(tab==='tx')b='<h1 style="font-size:28px;margin:18px 4px 12px">Transaksi</h1>'+txs(l.slice().sort(function(a,b){return b.date<a.date?-1:1}));
 else if(tab==='bud')b=budget(l);else b=more();
 document.getElementById('app').innerHTML=h+b;
 var T=[['ring','▦','Ringkasan'],['tx','🧾','Transaksi'],['fab','+','Catat'],['bud','👛','Anggaran'],['more','⋯','Lainnya']];
 document.getElementById('nav').innerHTML=T.map(function(x){return x[0]==='fab'?'<button class="fab" onclick="openS()" aria-label="Catat transaksi"><i>+</i>Catat</button>':'<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')}
function go(t){tab=t;draw();document.getElementById('app').scrollTop=0}
var F=document.getElementById('form'),S=document.getElementById('sheet');
function fillCats(){var ty=F.type.value,o=ty==='in'?['Gaji']:ty==='save'?['Tabungan']:Object.keys(LIM);F.cat.innerHTML=o.map(function(c){return '<option>'+c+'</option>'}).join('')}
F.addEventListener('change',function(e){if(e.target.name==='type')fillCats()});
function openS(){fillCats();S.classList.add('open');setTimeout(function(){F.amt.focus()},50)}
function closeS(){S.classList.remove('open')}
document.getElementById('cancel').onclick=closeS;
S.addEventListener('click',function(e){if(e.target===S)closeS()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeS()});
F.addEventListener('submit',function(e){e.preventDefault();var a=parseInt(F.amt.value.replace(/\D/g,''),10);if(!a){toast('Isi jumlah dulu');return}
 var d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 D.tx.push({id:D.nid++,type:F.type.value,amt:a,cat:F.cat.value,note:F.note.value,who:F.who.value,date:ds});
 if(F.type.value==='save'){GOALS[D.top%GOALS.length].s+=a}
