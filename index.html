<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuitDuo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8E7;--ink:#1A2340;--card:#FFFDF6;--mute:#7b7a8c;--line:#efe3c4;--red:#FF5A36;--lime:#C7F25B;--peach:#FFC2A8;--lav:#DCD3FF;--mint:#BDEBD9;
--sh:0 10px 24px -10px rgba(26,35,64,.22),inset 0 -4px 0 rgba(26,35,64,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121830;--ink:#FFF8E7;--card:#1D2648;--mute:#a4a8c4;--line:#2b3562}}
:root[data-theme="dark"]{--bg:#121830;--ink:#FFF8E7;--card:#1D2648;--mute:#a4a8c4;--line:#2b3562}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;justify-content:center}
h1,.big{font-family:'Baloo 2','Plus Jakarta Sans',sans-serif}
h1{font-size:28px;margin:18px 4px 4px}
#app{width:100%;max-width:440px;height:100%;overflow-y:auto;padding:14px 16px 130px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top,.row{display:flex;align-items:center;gap:8px}.top{justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font:800 24px 'Baloo 2'}
.mark{width:42px;height:42px;border-radius:14px;background:#1A2340;display:grid;place-items:center;box-shadow:var(--sh)}
.mark i{width:22px;height:22px;border-radius:50%;background:var(--lime);box-shadow:-7px 0 0 -2px var(--red);animation:bob 2.4s ease-in-out infinite}
.av{display:flex}.av b{width:auto;padding:0 10px;height:38px;border-radius:19px;display:grid;place-items:center;font:800 13px 'Baloo 2';color:#1A2340;border:3px solid var(--bg)}
.av b:first-child{background:var(--peach)}.av b:last-child{background:var(--lime);margin-left:-10px}
.pill{background:var(--card);border-radius:999px;padding:9px 14px;box-shadow:var(--sh);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pill button{font-size:20px;padding:0 6px}
.month{margin:14px 0 10px;justify-content:space-between}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}.sync:before{content:"";width:9px;height:9px;border-radius:50%;background:#2fb67c}
.sync.idle:before,.sync.off:before{background:#aaa}.sync.err:before{background:var(--red)}.sync.busy:before{background:#f2b705;animation:bob .6s infinite}
.hero{background:radial-gradient(circle at 85% 20%,#4a2a3f 0,#1A2340 55%);color:#FFF8E7;border-radius:32px;padding:22px;position:relative;overflow:hidden;box-shadow:0 18px 30px -14px rgba(26,35,64,.6);animation:rise .5s both}
.tag{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;display:inline-block}
.hero .lbl{margin-top:20px;opacity:.75}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin:4px 0 6px}
.hero p{opacity:.65;font-size:13px;max-width:58%}
.hb{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-top:10px;max-width:58%}.hb i{display:block;height:100%;border-radius:9px;animation:grow .9s both}
.sticker{position:absolute;right:14px;top:16px;background:#FFF8E7;color:var(--red);border-radius:14px;padding:7px 11px;font-weight:800;font-size:12px;transform:rotate(4deg);box-shadow:0 5px 0 rgba(0,0,0,.15);animation:wig 3s ease-in-out infinite}
.mas{position:absolute;right:16px;bottom:100px;width:86px;animation:bob 2s ease-in-out infinite}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
.stats{display:flex;justify-content:space-between;margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.stats small{opacity:.6;display:block}.stats b{font:800 18px 'Baloo 2'}
.stack{position:relative;height:196px;margin:8px 0}
.goal{position:absolute;inset:0;border-radius:30px;padding:18px 20px;box-shadow:var(--sh);color:#1A2340;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s;text-align:left;width:100%;overflow:hidden}
.goal .t{background:rgba(26,35,64,.12);border-radius:12px;padding:5px 10px;font-size:11px;font-weight:800;display:inline-block}
.goal h2{font:800 25px/1.1 'Baloo 2';margin-top:12px;max-width:70%}.goal .amt{opacity:.7;font-weight:700}
.goal .em{position:absolute;right:16px;top:40px;font-size:50px;animation:wig 2.5s ease-in-out infinite}
.bar{height:14px;background:rgba(26,35,64,.14);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:#1A2340;min-width:12px;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.goal .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.dots{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 16px;color:var(--mute);font-size:12px}
.dots span{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:width .3s}.dots i.on{width:34px;border-radius:99px;background:var(--ink)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--sh);animation:rise .5s both}
.box small{color:var(--mute);display:block}.box .big{font-size:24px;font-weight:800}
.w{grid-column:span 2}.c1{background:var(--lav);color:#1A2340}.c2{background:var(--peach);color:#1A2340}.c3{background:var(--mint);color:#1A2340}
.c1 small,.c2 small,.c3 small{color:#1A2340;opacity:.65}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:10px 0 6px;background:var(--line)}.split i{display:block;transition:width .6s}
.dn{display:flex;gap:16px;align-items:center;margin-top:8px}
.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;animation:spin .9s cubic-bezier(.2,.9,.3,1) both}
.ring:before{content:"";position:absolute;inset:17px;background:var(--card);border-radius:50%}.ring b{position:relative;font:800 14px 'Baloo 2'}
.dn ul{list-style:none;padding:0;flex:1;font-size:12.5px}.dn li{display:flex;justify-content:space-between;gap:6px;padding:2px 0}.dn li i{width:10px;height:10px;border-radius:50%;margin:5px 6px 0 0;flex:none}
h3{font:700 18px 'Baloo 2';margin:22px 4px 10px}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);width:100%;text-align:left;animation:rise .4s both;transition:transform .15s}
.tx:active{transform:scale(.97)}
.ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:none}
.tx div:nth-child(2){flex:1;min-width:0}.tx small{color:var(--mute)}.tx .n{white-space:nowrap}
.pos{color:#1c9c64}.neg{color:var(--red)}
.cat{margin-bottom:12px}.cat .h{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.cat .bar{background:var(--line);margin:8px 0 2px}.cat .bar i{background:var(--lime)}.cat .bar i.warn{background:#f7c948}.cat .bar i.over{background:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.chip{position:relative;flex:none}.chip input{position:absolute;opacity:0}
.chip span,.chips button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:13px;white-space:nowrap}
.chips button.on,.chip input:checked+span{background:var(--ink);color:var(--bg)}
.chip input:focus-visible+span{outline:3px solid var(--red)}
.chip i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.cg,.eg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:412px;background:var(--card);border-radius:30px;display:flex;align-items:flex-end;justify-content:space-around;padding:8px 6px;box-shadow:0 14px 30px -8px rgba(26,35,64,.35);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:20px;font-size:12px;font-weight:700;color:var(--mute)}
nav button span{font-size:22px;line-height:1}nav button.on{background:var(--bg);color:var(--ink)}
nav .fab{flex:none;width:78px;margin-top:-34px;color:var(--ink)}
.fab i{width:66px;height:66px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:500 38px/1 'Baloo 2';border:5px solid var(--card);box-shadow:0 10px 0 -2px rgba(255,90,54,.35);animation:wig 4s ease-in-out infinite;transition:transform .2s}
.fab:active i{transform:scale(.9) rotate(90deg)}
.sheet{position:fixed;inset:0;background:rgba(26,35,64,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:440px;max-height:92vh;overflow-y:auto;border-radius:32px 32px 0 0;padding:6px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,1.2,.4,1)}
.sheet h1{margin-top:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.seg label{position:relative}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px;border-radius:16px;background:var(--card);font-weight:700;box-shadow:var(--sh)}
.seg input:checked+span{background:var(--ink);color:var(--bg)}.seg input:focus-visible+span{outline:3px solid var(--red)}
.f{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:13px 14px;font:inherit;margin-bottom:10px}
.f.amt{font:800 28px 'Baloo 2'}
.btn{width:100%;background:var(--red);color:#fff;border-radius:20px;padding:14px;font-weight:800;font-size:16px;box-shadow:0 6px 0 #c9401f;margin-bottom:6px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9401f}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--sh);margin-top:10px}
.bi{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bi label{flex:1;font-weight:700}.bi .f{width:140px;margin:0;padding:9px 12px;text-align:right}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}.toast.s{transform:translate(-50%,0)}
.note{color:var(--mute);font-size:13px;margin:6px 4px 12px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes grow{from{width:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes wig{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-8deg)}96%{transform:rotate(8deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes spin{from{transform:rotate(-120deg) scale(.5);opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:10px}.bars button{flex:1;height:100%;display:flex;align-items:flex-end;padding:0}
.bars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--red);animation:grow2 .6s both;transform-origin:bottom}.bars i.z{background:var(--line)}.bars i.tod{outline:2px solid var(--ink)}
@keyframes grow2{from{transform:scaleY(0)}}
.qk{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 8px;scrollbar-width:none}.qk button{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:10px 14px;font-weight:700;box-shadow:var(--sh)}
.ibtn{width:44px;height:44px;border-radius:16px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:18px}
.tx:active{transform:scale(.97)}
</style></head><body>
<div id="app"></div><nav id="nav"></nav>
<div class="sheet" id="sh"><div class="in" id="shc"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=i=>document.getElementById(i);
const API='https://script.google.com/macros/s/AKfycbwyR2s1uoXbuR7AVgOBxsSUYlh3CKSRnXBM9XfZA6MFBHCBl4Cy1H98omxultjFOuAf/exec';
const CAT={Infaq:['🤲','#7ED6A8',.03],Meals:['🍜','#FF9F7A',.15],Toll:['🛣️','#F7C948',.03],Bensin:['⛽','#9B8CFF',.06],Transum:['🚌','#5CC8F2',.03],'Belanja Primer':['🛒','#C7F25B',.14],'Belanja Sekunder':['🛍️','#FF7DB0',.08],Tagihan:['💡','#F29E4C',.14],'Orang Tua':['👪','#E58BE6',.09],Saving:['🐷','#2fb67c',.25]};
const CK=Object.keys(CAT),INC={Gaji:['💼','#BDEBD9'],Bonus:['🎁','#FFE9A3'],Pemasukan:['✨','#DCD3FF']};
const meta=c=>CAT[c]||INC[c]||['💸','#cfcfcf'];
const LIM0={Infaq:500000,Meals:3000000,Toll:500000,Bensin:1000000,Transum:400000,'Belanja Primer':3000000,'Belanja Sekunder':1000000,Tagihan:2500000,'Orang Tua':1500000,Saving:3000000};
const GC=['#C7F25B','#FFC2A8','#DCD3FF','#BDEBD9','#FFE9A3'],EM=['🌴','🛟','💍','🏠','🚗','🎓','✈️','📱'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CFG0=()=>({lim:{...LIM0},warn:80,goals:[{id:'g1',n:'Liburan',t:15000000,b:0,d:'2026-12-20',e:'🌴',c:GC[0]},{id:'g2',n:'Dana darurat',t:30000000,b:0,d:'2027-06-30',e:'🛟',c:GC[1]},{id:'g3',n:'Nikahan kita',t:80000000,b:0,d:'2028-11-14',e:'💍',c:GC[2]}]});
let D={tx:[],q:[],cfg:CFG0(),top:0},TK='',ST='idle',tab='ring',FT='all',FQ='',E=null,SW=0,LH=0;
try{TK=localStorage.getItem('dd_tk')||'';Object.assign(D,JSON.parse(localStorage.getItem('duitduo2')||'{}'))}catch(e){}
const pad=n=>String(n).padStart(2,'0'),now=new Date();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let cur=today().slice(0,7);
const save=()=>{try{localStorage.setItem('duitduo2',JSON.stringify(D))}catch(e){}};
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),fmt=n=>Math.round(n).toLocaleString('id-ID');
const jt=n=>n>=1e9?'Rp'+(n/1e9).toFixed(1).replace('.',',')+' M':n>=1e6?'Rp'+(n/1e6).toFixed(1).replace('.',',').replace(',0','')+' jt':rp(n);
const pn=s=>parseInt(String(s).replace(/\D/g,''),10)||0,mf=e=>{e.value=e.value?fmt(pn(e.value)):''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mlabel=()=>{const p=cur.split('-');return BLN[+p[1]-1]+' '+p[0]};
const dl=d=>{if(!d)return'';const[y,m,x]=d.split('-');return 'TARGET '+(+x)+' '+BLN[+m-1].slice(0,3).toUpperCase()+' '+y};
const dnorm=v=>{v=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const d=new Date(v);return isNaN(d)?v.slice(0,10):d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mt=()=>D.tx.filter(t=>t.date.slice(0,7)===cur);
const sm=(l,f)=>l.filter(f).reduce((a,t)=>a+t.amt,0);
const spent=l=>sm(l,t=>t.type==='out'&&t.cat!=='Saving'),sv=l=>sm(l,t=>t.type==='out'&&t.cat==='Saving'),inc=l=>sm(l,t=>t.type==='in');
const lim=c=>D.cfg.lim[c]||0,tb=()=>CK.filter(c=>c!=='Saving').reduce((a,c)=>a+lim(c),0);
const gs=g=>(g.b||0)+sm(D.tx,t=>t.goal===g.id&&t.cat==='Saving'&&t.type==='out');
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function shift(d){const p=cur.split('-'),x=new Date(+p[0],+p[1]-1+d,1);cur=x.getFullYear()+'-'+pad(x.getMonth()+1);draw()}
function toast(m){const t=$('toast');t.textContent=m;t.className='toast s';clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2400)}
function burst(e){hap([12,30,12]);if(reduced())return;const x=innerWidth/2,y=innerHeight-90;for(let i=0;i<14;i++){const s=document.createElement('span'),a=Math.PI*2*i/14,d=60+Math.random()*70;s.textContent=e;s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:22px;z-index:30;pointer-events:none`;document.body.appendChild(s);
 s.animate([{transform:'translate(0,0) scale(.5)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-90}px) scale(1.2)`,opacity:1,offset:.5},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) scale(.8)`,opacity:0}],{duration:1000,easing:'ease-out'}).onfinish=()=>s.remove()}}
function cnt(){const e=document.querySelector('[data-v]');if(!e)return;const v=+e.dataset.v,f=LH;LH=v;if(f===v||reduced())return;const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/800);e.textContent=rp(f+(v-f)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)}
function mood(u,b){const r=b?u/b:0;return !u?['happy','yuk mulai catat! ✍️']:r>1?['sad','waduh, jebol! 😭']:r>=D.cfg.warn/100?['worry','mulai mepet nih…']:['happy','aman terkendali! ✨']}
function mascot(m){const mo={happy:'M32 58Q50 78 68 58',worry:'M34 68Q50 56 66 68',sad:'M34 70Q50 54 66 70'}[m];
 return `<svg class="mas" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="42" fill="#C7F25B"/><circle cx="26" cy="60" r="7" fill="#FF9F7A" opacity=".6"/><circle cx="74" cy="60" r="7" fill="#FF9F7A" opacity=".6"/><circle class="eye" cx="36" cy="44" r="6" fill="#1A2340"/><circle class="eye" cx="64" cy="44" r="6" fill="#1A2340"/><path d="${mo}" stroke="#1A2340" stroke-width="5" fill="none" stroke-linecap="round"/>${m==='sad'?'<path d="M72 52q4 8 0 11q-4-3 0-11" fill="#5CC8F2"/>':''}</svg>`}
function hero(l){const u=spent(l),b=tb(),r=b?u/b:0,[m,msg]=mood(u,b);
 return `<section class="hero"><span class="tag">✦ Pengeluaran</span><div class="lbl">Total pengeluaran bulan ini</div><div class="big" data-v="${u}">${rp(u)}</div><p>Bujet ${jt(b)} · ${Math.round(r*100)}% terpakai</p><div class="hb"><i style="width:${Math.min(100,r*100)}%;background:${r>1?'var(--red)':r>=D.cfg.warn/100?'#f7c948':'var(--lime)'}"></i></div><div class="sticker">${msg}</div>${mascot(m)}
 <div class="stats"><div><small>Pemasukan</small><b>${jt(inc(l))}</b></div><div><small>Ditabung</small><b>${jt(sv(l))}</b></div><div><small>Sisa</small><b>${jt(inc(l)-u-sv(l))}</b></div></div></section>`}
function stack(){const G=D.cfg.goals,n=G.length;if(!n)return `<p class="note">Belum ada target. Tambah di menu Lainnya.</p>`;let h='';

function openB(){showS(`<form onsubmit="saveB(event)"><h1>Atur budget</h1><p class="note">Batas per bulan untuk tiap kategori. Berlaku untuk semua bulan.</p>${CK.map((c,i)=>`<div class="bi"><label for="b${i}">${meta(c)[0]} ${c}</label><input class="f" id="b${i}" inputmode="numeric" value="${fmt(lim(c))}" oninput="mf(this);bt()"></div>`).join('')}
 <div class="box c1" style="margin:12px 0"><small>Total bujet pengeluaran (tanpa Saving)</small><div class="big" id="bto"></div><small id="bpc"></small></div>
 <label for="wr" style="font-weight:700">Peringatan saat terpakai <span id="wv">${D.cfg.warn}</span>%</label><input type="range" id="wr" min="50" max="100" step="5" value="${D.cfg.warn}" oninput="$('wv').textContent=this.value" style="width:100%;margin:8px 0 14px;accent-color:var(--red)">
 <button type="button" class="btn alt" style="margin-top:0" onclick="autoB()">✨ Bagi otomatis dari pemasukan bulan ini</button><button class="btn">Simpan budget</button><button type="button" class="btn alt" onclick="closeS()">Batal</button></form>`);bt()}
function bt(){const t=CK.reduce((a,c,i)=>a+(c==='Saving'?0:pn($('b'+i).value)),0),i=inc(mt());$('bto').textContent=rp(t);$('bpc').textContent=i?Math.round(t/i*100)+'% dari pemasukan bulan ini':''}
function autoB(){const i=inc(mt());if(!i){toast('Catat pemasukan bulan ini dulu ya');return}CK.forEach((c,x)=>{$('b'+x).value=fmt(Math.round(i*CAT[c][2]/50000)*50000)});bt();toast('Dibagi otomatis. Silakan sesuaikan ✏️')}
function saveB(e,id){e.preventDefault();CK.forEach((c,i)=>D.cfg.lim[c]=pn($('b'+i).value));D.cfg.warn=+$('wr').value;qc('lim');qc('warn');closeS();draw();toast('Budget tersimpan 💪');pull()}
function csv(){const r=['Tanggal\tJenis\tKategori\tCatatan\tOleh\tJumlah'].concat(D.tx.map(t=>[t.date,t.type,t.cat,t.note,t.who==='A'?'Richi':'Vega',t.amt].join('\t'))).join('\n');
 try{navigator.clipboard.writeText(r).then(()=>toast('Data tersalin 📋'),()=>toast('Gagal menyalin'))}catch(e){toast('Gagal menyalin')}}
function themeT(){const r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')}
function reset(){if(confirm('Hapus data di HP ini? Data di Google Sheets tidak ikut terhapus.')){D.tx=[];D.q=[];save();draw();toast('Data di HP dihapus');pull()}}
const lbl=()=>({ok:'Tersinkron',busy:'Menyinkronkan…',off:'Offline, tersimpan di HP',err:'Gagal sinkron (cek kata sandi)',idle:'Belum terhubung'})[ST];
function setST(x){ST=x;const e=document.querySelector('.sync');if(e){e.textContent=lbl();e.className='sync '+x}}
function setTK(){TK=$('tk').value.trim();try{localStorage.setItem('dd_tk',TK)}catch(e){}pull()}
const post=b=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TK,...b})}).then(r=>r.json()).then(j=>{if(!j.ok)throw 0});
function flush(){let p=Promise.resolve();D.q.slice().forEach(o=>{p=p.then(()=>post({action:o.a,tx:o.t,id:o.id,key:o.k,value:o.v})).then(()=>{D.q=D.q.filter(x=>x!==o);save()})});return p}
function pull(){if(!TK){setST('idle');return}setST('busy');
 flush().then(()=>fetch(API+'?token='+encodeURIComponent(TK))).then(r=>r.json()).then(j=>{if(!j||!Array.isArray(j.tx))throw 0;const b4=JSON.stringify([D.tx,D.cfg]);
  D.tx=j.tx.map(r=>{let ty=r.type,c=r.cat;if(ty==='save'){ty='out';c='Saving'}return{id:r.id,type:ty,amt:+r.amt,cat:c,note:r.note||'',who:r.who,date:dnorm(r.date),goal:r.goal||''}});
  D.q.forEach(o=>{if(o.a==='add'&&!D.tx.some(x=>x.id==o.t.id))D.tx.push(o.t);if(o.a==='upd')D.tx=D.tx.map(x=>x.id==o.t.id?o.t:x);if(o.a==='del')D.tx=D.tx.filter(x=>x.id!=o.id)});
  Object.keys(j.cfg||{}).forEach(k=>{if(!D.q.some(o=>o.a==='cfg'&&o.k===k)){if(k==='lim')D.cfg.lim={...LIM0,...j.cfg.lim};else D.cfg[k]=j.cfg[k]}});
  runRec();save();setST('ok');if(JSON.stringify([D.tx,D.cfg])!==b4&&!$('sh').classList.contains('open'))draw()}).catch(()=>setST(navigator.onLine?'err':'off'))}
let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy),r=e.target.closest&&e.target.closest('.tx[data-id]');if(r&&d<-90&&dy<30){SW=1;setTimeout(()=>SW=0,300);hap(20);if(confirm('Hapus transaksi ini?')){E=D.tx.find(x=>x.id==r.dataset.id);delTx()}return}if(Math.abs(d)>50&&e.target.closest&&e.target.closest('.stack')){SW=1;nextGoal(d>0?-1:1);setTimeout(()=>SW=0,300)}});
D.tx.forEach(t=>{if(t.type==='save'){t.type='out';t.cat='Saving'}});
runRec();urlAdd();draw();pull();addEventListener('online',pull);
</script></body></html>
