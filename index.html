<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan RV</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE7;--ink:#1A2340;--card:#FFFDF8;--mute:#7a7a8c;--line:rgba(26,35,64,.11);--red:#FF5A36;--lime:#C7F25B;--peach:#FFC9B3;--lav:#DCD3FF;--mint:#BDEBD9;--navbg:rgba(255,253,248,.94);
--sh:0 10px 30px -14px rgba(26,35,64,.24);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162e;--ink:#FFF8E7;--card:#1B2447;--mute:#a4a8c4;--line:rgba(255,248,231,.14);--navbg:rgba(27,36,71,.94)}}
:root[data-theme="dark"]{--bg:#10162e;--ink:#FFF8E7;--card:#1B2447;--mute:#a4a8c4;--line:rgba(255,248,231,.14);--navbg:rgba(27,36,71,.94)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}html,body{height:100%}
body{color:var(--ink);font:500 15px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 40vmax at 100% 0,rgba(199,242,91,.3),transparent 60%),radial-gradient(50vmax 40vmax at 0 100%,rgba(255,194,168,.28),transparent 60%)}
h1,.big,h2,h3{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin:6px 0 8px}
h3{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0}
.h2{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:6px 0}
.kick{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#4b526b}
:root[data-theme="dark"] .kick{color:var(--mute)}
.sub{font-size:16px;color:var(--mute);letter-spacing:-.01em;margin-bottom:4px}
#app{width:100%;max-width:440px;height:100%;overflow-y:auto;padding:14px 16px 140px;scrollbar-width:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px}
.top{position:sticky;top:0;z-index:4;margin:-14px -16px 10px;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;letter-spacing:-.05em}
.mark{width:42px;height:42px;border-radius:15px;background:#1A2340;display:grid;place-items:center;box-shadow:var(--sh)}
.mark i{width:24px;height:24px;border-radius:50%;background:var(--lime);box-shadow:-8px 0 0 -2px var(--red);animation:bob 2.4s ease-in-out infinite}
.ibtn{width:42px;height:42px;border-radius:15px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center}.ibtn svg{width:22px;height:22px}
.av{display:flex}.avb{width:40px;height:40px;border-radius:50%;font-weight:800;color:#1A2340;border:3px solid var(--bg);display:grid;place-items:center;font-size:15px;transition:transform .2s}
.avb.A{background:var(--peach)}.avb.V{background:var(--lime);margin-left:-10px}.avb.on{box-shadow:0 0 0 2px var(--ink);z-index:1;transform:scale(1.06)}
.pill{background:var(--card);border-radius:999px;padding:8px 12px;box-shadow:var(--sh);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.pill button{font-size:22px;padding:0 8px}.pill .ml{font-weight:800;font-size:15px;letter-spacing:-.02em;padding:6px 6px;white-space:nowrap}
.month{margin:16px 0 14px;justify-content:space-between}
.sync{white-space:nowrap;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:7px;font-weight:600}.sync:before{content:"";width:10px;height:10px;border-radius:50%;background:#2fb67c}
.sync.idle:before,.sync.off:before{background:#aaa}.sync.err:before{background:var(--red)}.sync.busy:before{background:#f2b705;animation:bob .6s infinite}
.qk{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding:2px 2px 8px;scrollbar-width:none}.qk button{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:13px 18px;font-weight:700;font-size:15px;box-shadow:var(--sh)}
.hero{background:radial-gradient(circle at 85% 20%,#4a2a3f 0,#1A2340 55%);color:#FFF8E7;border-radius:36px;padding:24px;position:relative;overflow:hidden;box-shadow:0 22px 34px -16px rgba(26,35,64,.65);animation:rise .5s both}
.tag{background:rgba(255,255,255,.13);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;display:inline-block}
.hm{font-size:13px;opacity:.65;font-weight:600}
.hero .lbl{margin-top:22px;opacity:.78;font-size:16px;font-weight:600}.eye2{margin-left:6px;font-size:15px}
.hero .big{font-size:clamp(34px,10.5vw,46px);font-weight:800;line-height:1.05;letter-spacing:-.055em;margin:6px 0 8px}
.hero p{opacity:.65;font-size:14px;max-width:60%}
.hb{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-top:10px;max-width:60%}.hb i{display:block;height:100%;border-radius:9px;animation:grow .9s both}
.hchip{display:inline-block;margin-top:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:7px 12px;font-size:12.5px;font-weight:700}
.sticker{position:absolute;right:14px;top:50px;background:#FFF8E7;color:var(--red);border-radius:14px;padding:8px 12px;font-weight:800;font-size:12px;transform:rotate(4deg);box-shadow:0 5px 0 rgba(0,0,0,.15);animation:wig 3s ease-in-out infinite;z-index:1}
.mas{position:absolute;right:18px;bottom:104px;width:84px;animation:bob 2s ease-in-out infinite}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
.stats{display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.stats small{opacity:.6;display:block;font-size:13px}.stats b{font-weight:800;font-size:20px;letter-spacing:-.04em}
.stack{position:relative;height:200px;margin:8px 0}
.goal{position:absolute;inset:0;border-radius:32px;padding:20px 22px;box-shadow:var(--sh);color:#1A2340;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s;text-align:left;width:100%;overflow:hidden}
.goal .t{background:rgba(26,35,64,.12);border-radius:14px;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.1em;display:inline-block}
.goal h2{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:12px;max-width:70%}.goal .amt{opacity:.7;font-weight:600}
.goal .em{position:absolute;right:18px;top:44px;font-size:52px;animation:wig 2.5s ease-in-out infinite}
.bar{height:14px;background:rgba(26,35,64,.14);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:#1A2340;min-width:12px;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.goal .meta,.meta{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.dots{display:flex;justify-content:space-between;align-items:center;margin:8px 4px 20px;color:var(--mute);font-size:13px;font-weight:600}
.dots span{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:width .3s}.dots i.on{width:34px;border-radius:99px;background:var(--ink)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.box{background:var(--card);border-radius:30px;padding:20px;box-shadow:var(--sh);border:1px solid rgba(26,35,64,.04);animation:rise .5s both}
.box small{color:var(--mute);display:block;font-size:13px}.box small.k{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.box .big{font-size:28px;font-weight:800;letter-spacing:-.05em;margin:10px 0 8px}
.w{grid-column:span 2}.c1{background:var(--lav);color:#1A2340}.c2{background:var(--peach);color:#1A2340}.c3{background:var(--mint);color:#1A2340}
.c1 small,.c2 small,.c3 small{color:#1A2340;opacity:.7}
.ch{display:flex;justify-content:space-between;align-items:center}.ci{font-style:normal;width:34px;height:34px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.cf{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:700}.cf span{white-space:nowrap}.cf span:last-child{font-weight:500;opacity:.7}.cf.g span:first-child{color:#1c9c64}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:12px 0 8px;background:var(--line)}.split i{display:block;transition:width .6s}
.obtn{border:1.5px solid var(--ink);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px}
.dpill{background:var(--ink);color:var(--bg);border-radius:99px;padding:11px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{border-radius:22px;padding:16px}.mini.o{background:rgba(255,194,168,.35)}.mini.b{background:rgba(120,140,255,.14)}.mini b{display:block;font-size:20px;letter-spacing:-.04em;margin-top:6px}
.dn{display:flex;gap:14px;align-items:center;margin-top:10px}.dw{position:relative;width:150px;height:150px;flex:none}.dw svg{width:100%;height:100%}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.dc small{font-size:11px;letter-spacing:.14em;font-weight:700}.dc b{font-size:19px;letter-spacing:-.04em;font-weight:800}
.dn ul{list-style:none;padding:0;flex:1;font-size:13px}.dn li{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:6px 0;align-items:center}.dn li span{display:flex;align-items:center;gap:7px}.dn li i{width:11px;height:11px;border-radius:50%;flex:none}.dn li em{font-style:normal;color:var(--mute);width:30px;text-align:right}
.lk2{font-weight:700;font-size:14px}
.arus svg{width:100%;height:auto;margin-top:6px}.arus text{fill:var(--mute);font-size:11px;font-weight:600}
.leg{display:flex;gap:14px;font-size:13px;font-weight:600}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.msg{display:flex;gap:12px;align-items:center;border-top:2px dashed var(--line);margin-top:10px;padding-top:14px;font-weight:500}.msg i{font-style:normal;width:46px;height:46px;border-radius:16px;background:var(--lime);display:grid;place-items:center;flex:none;color:#1A2340}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:10px}.bars button{flex:1;height:100%;display:flex;align-items:flex-end;padding:0}
.bars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--red);animation:grow2 .6s both;transform-origin:bottom}.bars i.z{background:var(--line)}.bars i.tod{outline:2px solid var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 12px}
.list{background:var(--card);border-radius:32px;padding:6px 20px 16px;box-shadow:var(--sh);animation:rise .5s both}
.tr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 0;border-top:2px dashed var(--line);transition:transform .15s}.tr:first-child{border-top:0}.tr:active{transform:scale(.98)}
.tr .ic{width:50px;height:50px;border-radius:17px;font-size:23px}.tm{flex:1;min-width:0}.tm b{display:block;font-size:16px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tm small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .n{font-size:15.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}.tr .n.pos{color:#13a068}.pen{color:var(--mute);display:grid}.pen svg{width:20px;height:20px}
.foot{text-align:center;color:var(--mute);margin-top:12px;font-weight:600;font-size:15px}
.srch{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:26px;padding:17px 20px;box-shadow:var(--sh);margin-bottom:14px;color:var(--mute)}.srch svg{width:24px;height:24px;flex:none}
.srch input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);outline:0;min-width:0}.srch:focus-within{outline:3px solid var(--red)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}.chips button{flex:none;padding:13px 20px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:15px;white-space:nowrap}.chips button.on{background:var(--ink);color:var(--bg)}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:24px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);width:100%;text-align:left;animation:rise .4s both}.tx:active{transform:scale(.98)}
.ic{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:21px;flex:none}.tx div:nth-child(2){flex:1;min-width:0}.tx small{color:var(--mute)}
.gcard{display:block;width:100%;text-align:left;margin-bottom:14px}.gt{background:rgba(26,35,64,.12);border-radius:14px;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.1em;color:#1A2340}.gcard{color:#1A2340}
.pos{color:#13a068}.neg{color:var(--red)}
.cat{margin-bottom:14px}.cat .h{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.cat .bar{background:var(--line);margin:10px 0 4px}.cat .bar i{background:var(--lime)}.cat .bar i.warn{background:#f7c948}.cat .bar i.over{background:var(--red)}
.chip{position:relative;flex:none}.chip input{position:absolute;opacity:0}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:99px;background:var(--bg);font-weight:700;font-size:14px;white-space:nowrap;border:1.5px solid var(--line)}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip input:focus-visible+span{outline:3px solid var(--red)}
.chip i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.cg,.eg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:416px;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:36px;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;padding:8px;box-shadow:0 18px 38px -10px rgba(26,35,64,.32);border:1px solid rgba(26,35,64,.05);z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 9px;border-radius:26px;font-size:11.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
nav button svg{width:26px;height:26px}nav button.on{background:var(--bg)}nav button.on svg{color:var(--red)}
nav .fab{padding:0;margin-top:-44px;gap:4px;border-radius:0;background:none}
.fab i{width:78px;height:78px;border-radius:30px;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal;font-size:42px;font-weight:300;border:5px solid var(--card);box-shadow:0 12px 24px -6px rgba(255,90,54,.55);animation:wig 4s ease-in-out infinite;transition:transform .2s}
.fab:active i{transform:scale(.9) rotate(90deg)}
.sheet{position:fixed;inset:0;background:rgba(26,35,64,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:9}.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:440px;max-height:92vh;overflow-y:auto;border-radius:38px 38px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,1.2,.4,1)}
.sheet h1{font-size:34px;margin-top:14px}
.xbtn{width:52px;height:52px;border-radius:18px;background:var(--bg);font-size:18px;flex:none}
.mg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 14px}
.mc{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border:2px solid var(--line);border-radius:30px;padding:22px 20px;text-align:left;transition:transform .15s}.mc:active{transform:scale(.97)}
.mi{width:54px;height:54px;border-radius:18px;background:var(--bg);display:grid;place-items:center;font-size:22px;margin-bottom:18px}.mc b{display:block;font-size:20px;letter-spacing:-.03em}.mc small{color:var(--mute);font-size:14px}
.mr2{display:flex;align-items:center;gap:16px;width:100%;border:2px solid var(--line);border-radius:30px;padding:18px 20px;text-align:left}.mr2 .mi{margin:0;background:var(--lav);flex:none}.mr2 div:not(.mi){flex:1}.mr2 b{display:block;font-size:20px;letter-spacing:-.03em}.mr2 small{color:var(--mute)}
.fn{border-top:2px dashed var(--line);margin-top:22px;padding-top:16px;color:var(--mute);font-size:14px}.fn span{color:var(--red)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mg button{padding:16px 0;border-radius:20px;background:var(--bg);font-weight:700}.mg button.on{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.seg label{position:relative}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px;border-radius:18px;background:var(--bg);font-weight:700}.seg input:checked+span{background:var(--ink);color:var(--bg)}.seg input:focus-visible+span{outline:3px solid var(--red)}
.f{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:14px 16px;font:inherit;font-size:16px;margin-bottom:10px}
.f.amt{font-weight:800;font-size:30px;letter-spacing:-.04em}
.btn{width:100%;background:var(--red);color:#fff;border-radius:22px;padding:16px;font-weight:800;font-size:16px;box-shadow:0 6px 0 #c9401f;margin-bottom:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9401f}.btn.alt{background:var(--bg);color:var(--ink);box-shadow:none;margin-top:10px;border:1.5px solid var(--line)}
.bi{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bi label{flex:1;font-weight:700}.bi .f{width:150px;margin:0;padding:10px 12px;text-align:right}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:700;z-index:20;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}.toast.s{transform:translate(-50%,0)}
.note{color:var(--mute);font-size:14px;margin:6px 4px 12px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}@keyframes grow{from{width:0}}@keyframes grow2{from{transform:scaleY(0)}}
@keyframes bob{50%{transform:translateY(-5px)}}@keyframes wig{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-8deg)}96%{transform:rotate(8deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes up{from{transform:translateY(60px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v7: anti-geser, teks lebih kecil, tampilan seamless ===== */
:root{--flat:rgba(255,255,255,.55)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--flat:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--flat:rgba(255,255,255,.07)}
html,body{overflow-x:hidden;max-width:100%;overscroll-behavior-x:none}
#app{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;padding:12px 16px 120px}
.bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.bento>*,.box,.list,.hero,.srch,.mc,.mr2,.stack,.goal,.gcard{min-width:0;max-width:100%}
.w{grid-column:1/-1}
.qk,.chips{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
.mg2,.duo,.seg{grid-template-columns:repeat(2,minmax(0,1fr))}
.dn li{grid-template-columns:minmax(0,1fr) auto auto}
.cf{flex-wrap:wrap}.cf span{white-space:normal}
.f{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
input[type=date].f{display:block;min-height:46px}
.stack{margin:8px 4px 6px}
/* ukuran teks */
h1{font-size:28px;letter-spacing:-.04em;margin:4px 0 6px}
.sub{font-size:13px}.kick{font-size:10.5px;letter-spacing:.16em}

<script>
const $=i=>document.getElementById(i);
const API='https://script.google.com/macros/s/AKfycbwyR2s1uoXbuR7AVgOBxsSUYlh3CKSRnXBM9XfZA6MFBHCBl4Cy1H98omxultjFOuAf/exec';
const CAT={Infaq:['🤲','#7ED6A8',.03],Meals:['🍜','#FF9F7A',.15],Toll:['🛣️','#F7C948',.03],Bensin:['⛽','#9B8CFF',.06],Transum:['🚌','#5CC8F2',.03],'Belanja Primer':['🛒','#C7F25B',.14],'Belanja Sekunder':['🛍️','#FF7DB0',.08],Tagihan:['💡','#F29E4C',.14],'Orang Tua':['👪','#E58BE6',.09],Saving:['🐷','#2fb67c',.25]};

const GC=['#C7F25B','#FFC2A8','#DCD3FF','#BDEBD9','#FFE9A3'],EM=['🌴','🛟','💍','🏠','🚗','🎓','✈️','📱'];

let D={tx:[],q:[],cfg:CFG0(),top:0},TK='',ST='idle',tab='ring',FT='all',FQ='',E=null,SW=0,LH=0,WHO='A',HIDE=false;
try{TK=localStorage.getItem('dd_tk')||'';WHO=localStorage.getItem('dd_who')||'A';HIDE=localStorage.getItem('dd_hide')==='1';Object.assign(D,JSON.parse(localStorage.getItem('duitduo2')||'{}'))}catch(e){}
const NM=k=>(D.cfg.names||{})[k]||(k==='A'?'Richi':'Vega');

const pn=s=>parseInt(String(s).replace(/\D/g,''),10)||0,mf=e=>{e.value=e.value?fmt(pn(e.value)):''};

const dnorm=v=>{v=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const d=new Date(v);return isNaN(d)?v.slice(0,10):d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mt=()=>D.tx.filter(t=>t.date.slice(0,7)===cur);
const sm=(l,f)=>l.filter(f).reduce((a,t)=>a+t.amt,0);

const lim=c=>D.cfg.lim[c]||0,tb=()=>CK.filter(c=>c!=='Saving').reduce((a,c)=>a+lim(c),0);
const gs=g=>(g.b||0)+sm(D.tx,t=>t.goal===g.id&&t.cat==='Saving'&&t.type==='out');
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function shift(d){const p=cur.split('-'),x=new Date(+p[0],+p[1]-1+d,1);cur=x.getFullYear()+'-'+pad(x.getMonth()+1);draw()}
function toast(m){const t=$('toast');t.textContent=m;t.className='toast s';clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2400)}
function burst(e){hap([12,30,12]);if(reduced())return;const x=innerWidth/2,y=innerHeight-90;for(let i=0;i<14;i++){const s=document.createElement('span'),a=Math.PI*2*i/14,d=60+Math.random()*70;s.textContent=e;s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:22px;z-index:30;pointer-events:none`;document.body.appendChild(s);
 s.animate([{transform:'translate(0,0) scale(.5)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-90}px) scale(1.2)`,opacity:1,offset:.5},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) scale(.8)`,opacity:0}],{duration:1000,easing:'ease-out'}).onfinish=()=>s.remove()}}
function cnt(){const e=document.querySelector('[data-v]');if(!e||HIDE)return;const v=+e.dataset.v,f=LH;LH=v;if(f===v||reduced())return;const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/800);e.textContent=rp(f+(v-f)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)}
function mood(u,b){const r=b?u/b:0;return !u?['happy','yuk mulai catat! ✍️']:r>1?['sad','waduh, jebol! 😭']:r>=D.cfg.warn/100?['worry','mulai mepet nih…']:['happy','aman terkendali! ✨']}
function mascot(m){const mo={happy:'M32 58Q50 78 68 58',worry:'M34 68Q50 56 66 68',sad:'M34 70Q50 54 66 70'}[m];
 return `<svg class="mas" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="42" fill="#C7F25B"/><circle cx="26" cy="60" r="7" fill="#FF9F7A" opacity=".6"/><circle cx="74" cy="60" r="7" fill="#FF9F7A" opacity=".6"/><circle class="eye" cx="36" cy="44" r="6" fill="#1A2340"/><circle class="eye" cx="64" cy="44" r="6" fill="#1A2340"/><path d="${mo}" stroke="#1A2340" stroke-width="5" fill="none" stroke-linecap="round"/>${m==='sad'?'<path d="M72 52q4 8 0 11q-4-3 0-11" fill="#5CC8F2"/>':''}</svg>`}

function stack(){const G=D.cfg.goals,n=G.length;if(!n)return `<p class="note">Belum ada target. Tambah di menu Lainnya.</p>`;let h='';
 for(let k=0;k<n;k++){const g=G[(D.top+k)%n],s=gs(g),p=Math.min(100,Math.round(s/g.t*100));
  h+=`<button class="goal" ${k?'tabindex="-1" aria-hidden="true"':'aria-label="Target berikutnya"'} style="background:${g.c};transform:translateY(${-k*16}px) scale(${1-k*.05}) rotate(${k?(k%2?-1.5:1.5):0}deg);z-index:${9-k};opacity:${k>2?0:1}" onclick="SW||nextGoal(1)"><span class="t">${dl(g.d)||'TARGET'}</span><span class="em">${p>=100?'🎉':g.e}</span><h2>${esc(g.n)}</h2><div class="amt">${jt(s)} dari ${jt(g.t)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>jalan ${p}%</span><span>${p>=100?'tercapai!':'sisa '+jt(g.t-s)}</span></div></button>`}
 return `<h3 style="margin-top:20px">Rencana kita</h3><div class="stack">${h}</div><div class="dots"><span>${G.map((_,i)=>`<i class="${i===D.top%n?'on':''}"></i>`).join('')}</span><span>geser atau ketuk</span></div>`}
function nextGoal(d){const n=D.cfg.goals.length;D.top=(D.top+d+n)%n;save();draw()}

const srt=a=>a.slice().sort((x,y)=>y.date<x.date?-1:y.date>x.date?1:y.id-x.id);



function bud(l){const u=spent(l),b=tb(),w=D.cfg.warn/100;
 return `${hd('RENCANA BUJET','Anggaran','Batas bulanan tiap kategori.')}${mrow()}<div class="box c1" style="margin-bottom:12px"><small>Total bujet pengeluaran</small><div class="big">${jt(u)} / ${jt(b)}</div><div class="bar"><i style="width:${Math.min(100,b?u/b*100:0)}%"></i></div></div>`+
 CK.map(c=>{const m=meta(c),L=lim(c),x=c==='Saving'?sv(l):sm(l,t=>t.type==='out'&&t.cat===c),p=L?x/L:0,s=c==='Saving';
  const st=s?(p>=1?'Target tabungan tercapai! 🎉':'Kurang '+jt(L-x)):p>1?'Jebol '+jt(x-L)+' 😱':p>=w?'Mulai mepet… 👀':'Sisa '+jt(L-x);
  return `<div class="box cat"><div class="h"><span>${m[0]} ${c}</span><span class="${!s&&p>1?'neg':''}">${jt(x)} / ${jt(L)}</span></div><div class="bar"><i class="${s?'':p>1?'over':p>=w?'warn':''}" style="width:${Math.min(100,p*100)}%"></i></div><small style="color:var(--mute)">${st}</small></div>`}).join('')+`<button class="btn" onclick="openB()">⚙️ Atur budget</button>`}

const hap=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function streak(){const s=new Set(D.tx.map(t=>t.date));let n=0,d=new Date();if(!s.has(today()))d.setDate(d.getDate()-1);while(s.has(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()))){n++;d.setDate(d.getDate()-1)}return n}
function insight(l){const[y,m]=cur.split('-').map(Number),dim=new Date(y,m,0).getDate(),isNow=cur===today().slice(0,7),dn=isNow?new Date().getDate():dim,d=Array(dim).fill(0);
 l.filter(t=>t.type==='out'&&t.cat!=='Saving').forEach(t=>d[+t.date.slice(8)-1]+=t.amt);
 const mx=Math.max(...d,1),u=spent(l),proj=dn?u/dn*dim:0,b=tb(),pm=new Date(y,m-2,1),pk=pm.getFullYear()+'-'+pad(pm.getMonth()+1),pu=spent(D.tx.filter(t=>t.date.slice(0,7)===pk&&+t.date.slice(8)<=dn));
 if(!u)return'';
 return `<div class="box w"><small>Pengeluaran harian · ketuk batang</small><div class="bars">${d.map((v,i)=>`<button aria-label="Tanggal ${i+1}: ${rp(v)}" onclick="hap(8);toast('${i+1} ${BLN[m-1].slice(0,3)}: ${rp(v)}')"><i class="${v?'':'z'}${i+1===dn&&isNow?' tod':''}" style="height:${Math.max(4,v/mx*100)}%;animation-delay:${i*18}ms"></i></button>`).join('')}</div>
 <div class="row" style="justify-content:space-between;margin-top:12px"><div><small>Proyeksi akhir bulan</small><b style="color:${b&&proj>b?'var(--red)':'inherit'}">${jt(proj)}</b></div><div style="text-align:right"><small>vs bulan lalu (periode sama)</small><b>${pu?(u>=pu?'▲ ':'▼ ')+Math.abs(Math.round((u-pu)/pu*100))+'%':'–'}</b></div></div></div>`}
function runRec(){const t0=today(),ym=t0.slice(0,7),dn=+t0.slice(8);(D.cfg.rec||[]).forEach(r=>{let h=0;for(const c of r.id)h=(h*31+c.charCodeAt(0))%1000000;const id=+(ym.replace('-','')+String(h).padStart(6,'0'));
 if(dn>=r.day&&!D.tx.some(x=>x.id==id)){const t={id,type:'out',amt:r.amt,cat:r.cat,note:r.n+' (rutin)',who:r.who,date:ym+'-'+pad(r.day),goal:''};D.tx.push(t);D.q.push({a:'add',t})}})}

 const R=D.cfg.rec||[];D.cfg.rec=id?R.map(x=>x.id===id?o:x):R.concat(o);qc('rec');runRec();save();closeS();draw();toast('Rutin tersimpan 🔁');pull()}

function adjAu(d){const t={id:Date.now(),type:d>0?'in':'out',amt:Math.abs(d),cat:d>0?'Pemasukan':'Belanja Sekunder',note:'Penyesuaian audit kas',who:'A',date:today(),goal:''};D.tx.push(t);D.q.push({a:'add',t});save();closeS();draw();toast('Penyesuaian dicatat');pull()}
const pa=s=>{s=String(s).trim();if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');return /^\d+[.,]\d{1,2}$/.test(s)?Math.round(parseFloat(s.replace(',','.'))):pn(s)};
const KW=[[/bensin|pertamina|shell|spbu|bp /i,'Bensin'],[/tol|jasamarga|e-?toll/i,'Toll'],[/gojek|grab|mrt|krl|transj|kai|bluebird|maxim|ojek/i,'Transum'],[/indomaret|alfamart|supermarket|hypermart|transmart|superindo/i,'Belanja Primer'],[/shopee|tokopedia|lazada|tiktok|blibli|zalora/i,'Belanja Sekunder'],[/pln|pdam|indihome|telkom|biznet|token listrik|bpjs/i,'Tagihan'],[/masjid|zakat|infaq|sedekah|kitabisa/i,'Infaq'],[/resto|kopi|coffee|warung|makan|bakso|kfc|mcd|starbucks|food/i,'Meals']];
const guess=s=>{for(const[r,c]of KW)if(r.test(s))return c;return 'Meals'};

 <div class="msg"><i>${IC.leaf.replace('<svg','<svg width="22" height="22"')}</i><span>${msg}</span></div></div>`}
function paling(l){const m={};l.filter(t=>t.type==='out'&&t.cat!=='Saving').forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);const a=Object.entries(m).sort((x,y)=>y[1]-x[1]),tot=a.reduce((s,x)=>s+x[1],0);if(!tot)return'';
 const R=60,C=2*Math.PI*R;let off=0;const segs=a.map(([k,v])=>{const len=v/tot*C,s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${meta(k)[1]}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len;return s}).join('');
 return `<div class="box w"><div class="row" style="justify-content:space-between"><span class="kick">Paling banyak keluar</span><button class="lk2" onclick="go('tx')">Semua →</button></div><h2 class="h2">Ke mana perginya?</h2><div class="dn"><div class="dw"><svg viewBox="0 0 160 160" aria-hidden="true">${segs}</svg><div class="dc"><small>TOTAL</small><b>${V(jt(tot))}</b></div></div><ul>${a.slice(0,5).map(([k,v])=>`<li><span><i style="background:${meta(k)[1]}"></i>${k}</span><b>${V(jt(v))}</b><em>${Math.round(v/tot*100)}%</em></li>`).join('')}</ul></div></div>`}
const split=l=>{const a=sm(l,t=>t.type==='out'&&t.who==='A'&&t.cat!=='Saving'),v=sm(l,t=>t.type==='out'&&t.who==='V'&&t.cat!=='Saving'),tot=a+v||1;return `<div class="box w"><small class="k">Siapa yang jajan lebih banyak?</small><div class="split"><i style="width:${a/tot*100}%;background:var(--peach)"></i><i style="width:${v/tot*100}%;background:var(--lime)"></i></div><div class="row" style="justify-content:space-between"><b>${esc(NM('A'))} ${V(jt(a))}</b><b>${esc(NM('V'))} ${V(jt(v))}</b></div></div>`};
const tr=t=>{const m=meta(t.cat),d=t.date.split('-');return `<button class="tr" data-id="${t.id}" onclick="openTx(${t.id})"><div class="ic" style="background:${m[1]}33">${m[0]}</div><div class="tm"><b>${esc(t.note||t.cat)}</b><small>${t.cat} · ${+d[2]} ${BLN[+d[1]-1].slice(0,3)} · ${esc(NM(t.who))}</small></div><b class="n ${t.type==='in'?'pos':''}">${t.type==='in'?'+':'−'} ${V(jt(t.amt))}</b><span class="pen">${IC.pen}</span></button>`};
function homeV(l){return hd('HALO, '+esc(NM(WHO)).toUpperCase(),'Uang kita','Mencatat sebagai '+esc(NM(WHO))+'. Ketuk avatar untuk ganti.'+(streak()?' 🔥 '+streak()+' hari beruntun':''))+mrow()+qk()+hero(l)+stack()+`<div class="bento">${cards(l)}${kondisi(l)}${arus()}${paling(l)}${insight(l)}${split(l)}</div><div class="sec"><h3>Transaksi terbaru</h3><button class="lk2" onclick="go('tx')">Semua →</button></div>`+(l.length?`<div class="list">${srt(l).slice(0,3).map(tr).join('')}</div>`:'<p class="note">Belum ada catatan. Ketuk tombol + untuk mulai.</p>')}
function txV(l){const cs=[...new Set(l.map(t=>t.cat))];if(FT!=='all'&&!cs.includes(FT))FT='all';
 return hd('CATATAN KITA','Semua transaksi','Setiap catatan kecil bantu kita lihat pola belanja.')+mrow()+`<label class="srch">${IC.search}<input placeholder="Cari transaksi atau kategori..." value="${esc(FQ)}" oninput="FQ=this.value;listTx()" aria-label="Cari transaksi"></label><div class="chips"><button class="${FT==='all'?'on':''}" onclick="FT='all';draw()">Semua</button>${cs.map(c=>`<button class="${FT===c?'on':''}" onclick="FT='${c}';draw()">${meta(c)[0]} ${c}</button>`).join('')}</div><div class="list" id="txl"></div>`}
function listTx(){const all=mt(),l=srt(all).filter(t=>(FT==='all'||t.cat===FT)&&(!FQ||(t.note+t.cat).toLowerCase().includes(FQ.toLowerCase())));$('txl').innerHTML=(l.length?l.map(tr).join(''):'<p class="note" style="text-align:center">Tidak ada transaksi.</p>')+`<p class="foot">Menampilkan ${l.length} dari ${all.length} transaksi</p>`}
const goalV=()=>hd('IMPIAN KITA','Rencana kita','Target & mimpi yang kita kejar bareng.')+D.cfg.goals.map(g=>{const s=gs(g),p=Math.min(100,Math.round(s/g.t*100));return `<button class="box gcard" style="background:${g.c}" onclick="openG('${g.id}')"><div class="row" style="justify-content:space-between"><span class="gt">${dl(g.d)||'TARGET'}</span><span style="font-size:28px">${p>=100?'🎉':g.e}</span></div><h2 class="h2">${esc(g.n)}</h2><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${V(jt(s))} dari ${V(jt(g.t))}</span><span>${p}%</span></div></button>`}).join('')+`<button class="btn alt" onclick="openG()">+ Tambah target</button>`;
const setV=()=>hd('PENGATURAN','Atur FinanceRV','Nama, tampilan, dan koneksi spreadsheet.')+`<div class="box" style="margin-bottom:14px"><b>Nama kita</b><div class="row" style="margin-top:12px"><input class="f" id="nA" value="${esc(NM('A'))}" aria-label="Nama pertama" style="margin:0"><input class="f" id="nV" value="${esc(NM('V'))}" aria-label="Nama kedua" style="margin:0"></div><button class="btn alt" onclick="saveN()">Simpan nama</button></div>
 <div class="box" style="margin-bottom:14px"><b>Sinkron Google Sheets</b><p class="note">Status: ${lbl()}. Isi dengan kata sandi yang sama dengan TOKEN di Apps Script.</p><input class="f" id="tk" type="password" placeholder="Kata sandi sinkron" value="${esc(TK)}" aria-label="Kata sandi sinkron"><button class="btn" onclick="setTK()">Simpan &amp; sinkronkan</button></div>
 <div class="sec"><h3>Transaksi rutin</h3></div>${(D.cfg.rec||[]).map(r=>`<button class="tx" onclick="openR('${r.id}')"><div class="ic" style="background:${meta(r.cat)[1]}">${meta(r.cat)[0]}</div><div><b>${esc(r.n)}</b><br><small>Tiap tgl ${r.day} · ${jt(r.amt)} · ${esc(NM(r.who))}</small></div><span class="pen">${IC.pen}</span></button>`).join('')}<button class="btn alt" onclick="openR()">+ Tambah rutin</button>
 <div class="sec"><h3>Tampilan &amp; data</h3></div><button class="btn alt" style="margin-top:0" onclick="togH()">${HIDE?'Tampilkan':'Sembunyikan'} saldo</button><button class="btn alt" onclick="themeT()">Ganti tema terang/gelap</button><button class="btn alt" onclick="csv()">Salin data (CSV)</button><button class="btn alt" onclick="reset()">Hapus data di HP ini</button>`;
function saveN(){D.cfg.names={A:$('nA').value.trim()||'Richi',V:$('nV').value.trim()||'Vega'};qc('names');draw();toast('Nama tersimpan');pull()}
function openMore(){const c=[['◎','Rencana','Target & mimpi kita',"closeS();go('goal')"],['⚖','Akuntan','Audit tarik tunai','openAu()'],['↙','Pemasukan','Isi uang masuk',"closeS();openTx(0,{type:'in',cat:'Gaji'})"],['⟳','Tabungan','Atur saving bulan ini','openB()']];
 showS(`<div class="row" style="justify-content:space-between;align-items:flex-start;margin-top:14px"><div><p class="kick"><span style="color:var(--red)">✦</span> Ruang lainnya</p><h1 style="margin-top:6px">Mau ke mana?</h1></div><button class="xbtn" onclick="closeS()" aria-label="Tutup">✕</button></div><p class="sub">Semua fitur tetap dekat, tanpa membuat menu bawah jadi penuh.</p><div class="mg2">${c.map(x=>`<button class="mc" onclick="${x[3]}"><div class="mi">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><button class="mr2" onclick="closeS();go('set')"><div class="mi">⚙</div><div><b>Pengaturan</b><small>Nama, tampilan, dan koneksi spreadsheet</small></div><span style="font-size:22px">→</span></button><p class="fn"><span>♡</span> Menu bawah sengaja 5 slot supaya tombol Catat tetap pas di tengah.</p>`)}
function go(t){hap(6);tab=t;draw();$('app').scrollTop=0}
function draw(){const l=mt();const b=tab==='ring'?homeV(l):tab==='tx'?txV(l):tab==='bud'?bud(l):tab==='goal'?goalV():setV();
 $('app').innerHTML=`<div class="top"><div class="logo"><div class="mark"><i></i></div>FinanceRV</div><div class="row"><button class="ibtn" aria-label="Anggaran" onclick="go('bud')">${IC.chart}</button><div class="av">${av()}</div></div></div>`+b;
 if(tab==='tx')listTx();if(tab==='ring')cnt();
 $('nav').innerHTML=[['ring','Ringkasan'],['tx','Transaksi'],['fab'],['bud','Anggaran'],['more','Lainnya']].map(x=>x[0]==='fab'?'<button class="fab" onclick="openTx()" aria-label="Catat transaksi"><i>+</i>Catat</button>':`<button class="${tab===x[0]||(x[0]==='more'&&(tab==='goal'||tab==='set'))?'on':''}" onclick="${x[0]==='more'?'openMore()':`go('${x[0]}')`}">${IC[x[0]]}<span>${x[1]}</span></button>`).join('')}
D.tx.forEach(t=>{if(t.type==='save'){t.type='out';t.cat='Saving'}});
runRec();urlAdd();draw();pull();addEventListener('online',pull);
</script></body></html>
